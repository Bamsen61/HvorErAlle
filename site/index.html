<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HvorErAlle">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'">
  <title>HvorErAlle</title>
  <script>
    (() => {
      const validKeys = new Set([
        "J2ZrXMP0wj", "Tst5rLb7Ae", "f4XPSqhTJD", "9MOvJJGRc7",
        "gsvweXC8cB", "M2tgVaUDrK", "qhEI1lwqDq", "rZGKuHEAnw",
        "hOGUL3Ijh5", "ifP5y9KtfJ", "tjwXHGA8b8"
      ]);
      const suppliedKey = new URLSearchParams(location.search).get("Key");
      let storedKey = null;
      try { storedKey = localStorage.getItem("hva-key"); } catch {}
      const key = suppliedKey === null ? storedKey : suppliedKey;

      if (!validKeys.has(key)) {
        document.documentElement.textContent = "";
        location.replace("about:blank");
        throw new Error("Invalid application key");
      }

      try { localStorage.setItem("hva-key", key); } catch {}
      window.__HVA_KEY__ = key;

      if ("serviceWorker" in navigator) {
        let reloading = false;
        const wasControlled = Boolean(navigator.serviceWorker.controller);
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!wasControlled || reloading) return;
          reloading = true;
          location.reload();
        });
        const registration = navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
        registration.catch(console.error);
        const checkForUpdate = () => registration.then(worker => worker.update()).catch(console.error);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkForUpdate();
        });
        window.addEventListener("online", checkForUpdate);
      }
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>HvorErAlle</h1>
      <p id="identity">Kobler til …</p>
    </div>
    <div class="legend" aria-label="Tegnforklaring">
      <span><i class="dot fresh"></i>0–20 min</span>
      <span><i class="dot aging"></i>20–45 min</span>
      <span><i class="dot stale"></i>&gt;45 min</span>
      <span><i class="dot static"></i>Sted</span>
    </div>
  </header>
  <main>
    <div id="map" aria-label="Kart med siste kjente posisjoner"></div>
    <div id="status" class="status" role="status" aria-live="polite">Starter …</div>
  </main>
  <noscript>Denne appen krever JavaScript.</noscript>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./vendor/firebase/firebase-app-compat.js"></script>
  <script src="./vendor/firebase/firebase-auth-compat.js"></script>
  <script src="./vendor/firebase/firebase-database-compat.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
